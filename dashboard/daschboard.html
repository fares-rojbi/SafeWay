<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SafeWAY Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #1f1f1f;
        color: white;
        margin: 0;
        padding: 0;
      }

      header {
        background-color: #282c34;
        padding: 20px;
        text-align: center;
        font-size: 1.8em;
        font-weight: bold;
        border-bottom: 2px solid #00bcd4;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 30px;
        max-width: 1400px;
        margin: 0 auto;
      }

      @media (max-width: 1200px) {
        .dashboard {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .dashboard {
          grid-template-columns: 1fr;
        }
      }

      .widget {
        background: #2c2f36;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 0 10px #00bcd4;
        text-align: center;
        transition: transform 0.3s ease;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .widget:hover {
        transform: translateY(-5px);
      }

      .widget h2 {
        font-size: 1.2em;
        margin-bottom: 10px;
        color: #00bcd4;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .widget .value {
        font-size: 2em;
        font-weight: bold;
      }

      .alert {
        color: #ff4c4c;
        font-weight: bold;
      }

      .widget i {
        font-size: 1.5em;
        color: #00bcd4;
      }
    </style>
  </head>
  <body>
    <header>SafeWAY - Dashboard</header>

    <div class="dashboard">
      <div class="widget">
        <h2><i class="fas fa-thermometer-half"></i> Temperature</h2>
        <div class="value" id="temp">-- °C</div>
      </div>

      <div class="widget">
        <h2><i class="fas fa-tint"></i> Humidity</h2>
        <div class="value" id="humidity">-- %</div>
      </div>

      <div class="widget">
        <h2><i class="fas fa-cloud-rain"></i> Rain Alert</h2>
        <div class="value alert" id="rain">--</div>
      </div>

      <div class="widget">
        <h2><i class="fas fa-eye"></i> Visibility</h2>
        <div class="value" id="visibility">-- %</div>
      </div>

      <div class="widget">
        <h2><i class="fas fa-tachometer-alt"></i> Speed Limit</h2>
        <div class="value" id="speed-limit">50 km/h</div>
      </div>
    </div>

    <script>
      const BLYNK_TOKEN = "eoEpuHJF2CoI0rstb28SerwkQsmHetxI";

      async function fetchData() {
        try {
          const [temp, humidity, visibility, rain] = await Promise.all([
            fetch(
              `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V0`
            ).then((res) => res.text()),
            fetch(
              `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V1`
            ).then((res) => res.text()),
            fetch(
              `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V2`
            ).then((res) => res.text()),
            fetch(
              `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V3`
            ).then((res) => res.text()),
          ]);

          document.getElementById("temp").innerText = `${temp} °C`;
          document.getElementById("humidity").innerText = `${humidity} %`;
          document.getElementById("visibility").innerText = `${visibility} %`;
          document.getElementById("rain").innerText =
            rain === "1" ? "🌧️ Rain detected" : "☀️ No rain";
        } catch (error) {
          console.error("Error while fetching data:", error);
        }
      }

      // Update every 5 seconds
      setInterval(fetchData, 5000);
      fetchData(); // Initial load
    </script>
  </body>
</html>
